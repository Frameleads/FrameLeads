name: FrameLeads isolated decision regression
on:
  push:
    branches:
      - engineering/reply-decision-safety-20261031

permissions:
  contents: read

concurrency:
  group: isolated-decision-regression
  cancel-in-progress: true

jobs:
  regression:
    if: github.ref == 'refs/heads/engineering/reply-decision-safety-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:5432/nonexistent
      GEMINI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate local Prisma client without database connection
        run: npx --no-install prisma generate
      - name: TypeScript full-project check
        id: types
        continue-on-error: true
        run: npx --no-install tsc --noEmit --pretty false
      - name: Decision engine tests
        id: decision
        continue-on-error: true
        run: npm run test:decision
      - name: Automation and action tests
        id: automation
        continue-on-error: true
        run: npm run test:automation
      - name: Sales Constitution tests
        id: constitution
        continue-on-error: true
        run: npm run test:constitution
      - name: Decision Sandbox tests
        id: sandbox
        continue-on-error: true
        run: npm run test:decision-sandbox
      - name: Decision Replay tests
        id: replay
        continue-on-error: true
        run: npm run test:decision-replay
      - name: Response SLA tests
        id: sla
        continue-on-error: true
        run: npm run test:response-sla
      - name: Decision intent signals
        id: signals
        continue-on-error: true
        run: npm run test:decision-intent-signals
      - name: Inbox triage QA
        id: inbox
        continue-on-error: true
        run: npm run test:inbox-triage-qa
      - name: Final pass/fail gate
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          DECISION: ${{ steps.decision.outcome }}
          AUTOMATION: ${{ steps.automation.outcome }}
          CONSTITUTION: ${{ steps.constitution.outcome }}
          SANDBOX: ${{ steps.sandbox.outcome }}
          REPLAY: ${{ steps.replay.outcome }}
          SLA: ${{ steps.sla.outcome }}
          SIGNALS: ${{ steps.signals.outcome }}
          INBOX: ${{ steps.inbox.outcome }}
        shell: bash
        run: |
          failed=0
          for item in TYPES DECISION AUTOMATION CONSTITUTION SANDBOX REPLAY SLA SIGNALS INBOX; do
            status="${!item}"
            echo "$item=$status"
            if [ "$status" != "success" ]; then failed=1; fi
          done
          exit "$failed"
