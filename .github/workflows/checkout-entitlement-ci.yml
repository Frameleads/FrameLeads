name: Checkout Enterprise entitlement verification
on:
  pull_request:
    paths:
      - "src/lib/entitlements.ts"
      - "src/lib/whop-*.ts"
      - "src/lib/auth-guard.ts"
      - "src/app/api/admin/whop-sync/route.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/20261027120000_enterprise_grandfathered_quota/**"
      - "tests/entitlements.test.ts"
      - "tests/whop-*.test.ts"
      - ".github/workflows/checkout-entitlement-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate local Prisma client (no database access)
        run: npx prisma generate
      - name: Verify new and grandfathered quota
        run: npm run test:entitlements
      - name: Verify Whop membership and refresh regression
        run: npm run test:whop-memberships
      - name: Verify Whop OAuth regression
        run: npm run test:whop-oauth
      - name: Check TypeScript
        run: npx tsc --noEmit
