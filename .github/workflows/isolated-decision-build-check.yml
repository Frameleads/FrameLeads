name: FrameLeads isolated production build check
on:
  push:
    branches:
      - engineering/reply-decision-safety-20261031

permissions:
  contents: read

concurrency:
  group: isolated-decision-build-20261031
  cancel-in-progress: true

jobs:
  build-only:
    if: github.ref == 'refs/heads/engineering/reply-decision-safety-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://isolated:isolated@127.0.0.1:5432/nonexistent"
      DIRECT_URL: "postgresql://isolated:isolated@127.0.0.1:5432/nonexistent"
      GEMINI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      WHOP_API_KEY: ""
      RESEND_API_KEY: ""
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Check out proposed branch without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 24 to match Vercel project setting
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked dependencies without npm lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production-style Next.js build (no deploy or migrations)
        run: npm run build
