name: PR21 isolated nonproduction database E2E
on:
  push:
    branches:
      - qa/isolated-postrelease-e2e-20261031
permissions:
  contents: read
concurrency:
  group: pr21-ephemeral-db-e2e
  cancel-in-progress: true
jobs:
  isolated-e2e:
    if: github.ref == 'refs/heads/qa/isolated-postrelease-e2e-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout QA branch without persistent token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: false
      - name: Assert runner and no application credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "qa/isolated-postrelease-e2e-20261031"
          test ! -f .env && test ! -f .env.production
          echo "QA_CHECKOUT_SHA=$(git rev-parse HEAD)"
          echo "QA_BASE_VERSION=4de87ed15bfcd130e76f5ef5edb0ca732b9559a9"
          echo 'QA_RUNNER_NO_SECRETS_INJECTED'
      - name: Build throwaway image, never deploy
        run: docker build --pull --file qa/Dockerfile.pr21 --tag frameleads-pr21-qa-only:local .
      - name: Run real Prisma against disposable PostgreSQL with NO networking
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --name frameleads-pr21-qa-only \
            --pids-limit 512 --memory 5g \
            --env CI=true --env NEXT_TELEMETRY_DISABLED=1 \
            frameleads-pr21-qa-only:local
